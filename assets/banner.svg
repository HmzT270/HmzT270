<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" font-family="'Segoe UI', Ubuntu, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#14204a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <style>
    .c1,.c2,.c3,.c4{opacity:0;animation-duration:10s;animation-iteration-count:infinite}
    .c1{animation-name:k1}.c2{animation-name:k2}.c3{animation-name:k3}.c4{animation-name:k4}
    @keyframes k1{0%,14%{opacity:0}18%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes k2{0%,34%{opacity:0}38%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes k3{0%,54%{opacity:0}58%,92%{opacity:1}97%,100%{opacity:0}}
    @keyframes k4{0%,74%{opacity:0}78%,92%{opacity:1}97%,100%{opacity:0}}
    .fill{transform-box:fill-box;transform-origin:left center;animation:p 10s infinite}
    @keyframes p{0%,14%{transform:scaleX(0)}18%,34%{transform:scaleX(.25)}38%,54%{transform:scaleX(.5)}58%,74%{transform:scaleX(.75)}78%,92%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
    .cur{animation:b 1s steps(1) infinite}
    @keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}
    .glow{animation:g 4s ease-in-out infinite}
    @keyframes g{0%,100%{opacity:.35}50%{opacity:.7}}
  </style>

  <rect width="900" height="240" fill="url(#bg)"/>
  <circle class="glow" cx="120" cy="40" r="90" fill="#1D4ED8" opacity=".35"/>
  <circle class="glow" cx="820" cy="210" r="80" fill="#F59E0B" opacity=".25"/>

  <text x="44" y="98" font-size="42" font-weight="700" fill="#ffffff">Hamza Taşbay</text>
  <text x="46" y="134" font-size="18" fill="#38BDF8">Software Engineering Student</text>
  <text x="46" y="162" font-size="15" fill="#8B949E">Full-Stack · Systems · Automation</text>
  <rect class="cur" x="46" y="176" width="10" height="3" fill="#F59E0B"/>

  <g>
    <rect x="490" y="28" width="370" height="184" rx="8" fill="#161b22" stroke="#30363d"/>
    <circle cx="508" cy="46" r="4.5" fill="#ff5f56"/>
    <circle cx="524" cy="46" r="4.5" fill="#ffbd2e"/>
    <circle cx="540" cy="46" r="4.5" fill="#27c93f"/>
    <text x="675" y="50" font-size="12" fill="#8B949E" text-anchor="middle">installer.exe</text>
    <line x1="490" y1="62" x2="860" y2="62" stroke="#30363d"/>

    <g font-size="14" fill="#C9D1D9">
      <rect x="512" y="76" width="16" height="16" rx="3" fill="none" stroke="#38BDF8"/>
      <path class="c1" d="M516 84 l4 4 l7 -8" fill="none" stroke="#27c93f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="540" y="89">React + MUI</text>

      <rect x="512" y="102" width="16" height="16" rx="3" fill="none" stroke="#38BDF8"/>
      <path class="c2" d="M516 110 l4 4 l7 -8" fill="none" stroke="#27c93f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="540" y="115">.NET Core API</text>

      <rect x="512" y="128" width="16" height="16" rx="3" fill="none" stroke="#38BDF8"/>
      <path class="c3" d="M516 136 l4 4 l7 -8" fill="none" stroke="#27c93f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="540" y="141">MS SQL Server</text>

      <rect x="512" y="154" width="16" height="16" rx="3" fill="none" stroke="#38BDF8"/>
      <path class="c4" d="M516 162 l4 4 l7 -8" fill="none" stroke="#27c93f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="540" y="167">Docker</text>
    </g>

    <rect x="512" y="186" width="326" height="8" rx="4" fill="#0D1117" stroke="#30363d"/>
    <rect class="fill" x="512" y="186" width="326" height="8" rx="4" fill="url(#bar)"/>
  </g>
</svg>
